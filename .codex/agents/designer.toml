# Codex Agent: designer
# 高保真原型设计

[agent]
name = "designer"
description = """
设计师 Agent。基于 PM 产出的 PRD 和低保真 wireframe，生成高保真 Hi-Fi 原型图。
覆盖主题选型、品牌配色、组件系统、交互动效、视觉规范。
Use when: 用户需要高保真原型图、将 wireframe 升级为高保真、UI 原型设计、视觉设计、生成 hifi prototype、将低保真转高保真。
"""
input_hint = "提供 PRD 或 wireframe 路径，例如：将 projects/prd-videoprompt-ai/wireframes 升级为高保真原型"
mode = "workspace-write"

[agent.tools]
allowed = ["read", "edit", "search", "todo", "figma/*"]

[agent.routing]
handoff_agents = []

[agent.system_prompt]
file = "../.github/agents/designer.agent.md"
