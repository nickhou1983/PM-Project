# Codex Agent: post_launch_review
# 上线复盘与迭代决策

[agent]
name = "post_launch_review"
description = """
上线复盘与迭代决策 Agent。在产品或功能上线后，收集埋点数据、用户反馈和运营指标，输出结构化复盘报告和迭代建议，补齐 Build-Measure-Learn 闭环。
Use when: 上线后复盘、数据分析、迭代决策、功能效果评估、A/B 测试分析、用户反馈汇总、NPS 分析、产品健康度检查。
"""
input_hint = "描述要复盘的功能或版本，例如：复盘 AI 对话功能上线一周的数据表现"
mode = "workspace-write"

[agent.tools]
allowed = ["read", "search", "web", "edit", "execute", "todo"]

[agent.routing]
handoff_agents = []

[agent.system_prompt]
file = "../.github/agents/post_launch_review.agent.md"
