# Codex Agent: pr_review_submit
# PR Review 提交

[agent]
name = "pr_review_submit"
description = """
专门负责将代码审查结果自动写入 GitHub PR Review。
适用于审查完成后批量创建行级评论、提交 APPROVE/REQUEST_CHANGES/COMMENT。
"""
input_hint = "提供 owner/repo/pull number，以及审查结论和逐条问题（含文件与行号）"
mode = "read-only"

[agent.tools]
allowed = ["read", "search", "changes"]

[agent.routing]
handoff_agents = []

[agent.system_prompt]
file = "../.github/agents/pr_review_submit.agent.md"
