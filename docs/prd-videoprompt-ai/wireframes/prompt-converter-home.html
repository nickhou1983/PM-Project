<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页/工作台 - VideoPrompt AI 原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #333;
      background: #fff;
      max-width: 1200px;
      margin: 0 auto;
      border: 1px solid #d0d0d0;
      min-height: 100vh;
    }
    .header {
      background: #f5f5f5;
      padding: 12px 24px;
      border-bottom: 1px solid #d0d0d0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .nav { display: flex; gap: 16px; }
    .nav a {
      color: #888;
      text-decoration: none;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .nav a.active { color: #333; font-weight: 600; background: #e0e0e0; }
    .nav a:hover { color: #333; }
    .content { padding: 32px 24px; }
    .card {
      background: #f5f5f5;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: #555;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-secondary {
      background: #fff;
      color: #555;
      border: 1px solid #aaa;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .input-field {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      margin-bottom: 12px;
    }
    textarea.input-field { resize: vertical; }
    .text-secondary { color: #888; font-size: 12px; }
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-12 { gap: 12px; }
    .gap-16 { gap: 16px; }
    .mt-12 { margin-top: 12px; }
    .mb-12 { margin-bottom: 12px; }
    .mb-24 { margin-bottom: 24px; }
    .select-field {
      padding: 10px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      min-width: 180px;
    }
    .hero {
      text-align: center;
      padding: 40px 0 32px;
    }
    .hero h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .hero p { color: #888; font-size: 16px; }
    .tab-switch {
      display: flex;
      border-bottom: 2px solid #d0d0d0;
      margin-bottom: 24px;
    }
    .tab-switch a {
      padding: 8px 24px;
      text-decoration: none;
      color: #888;
      font-size: 15px;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-switch a.active {
      color: #333;
      font-weight: 600;
      border-bottom-color: #555;
    }
    .model-tag {
      display: inline-block;
      padding: 4px 12px;
      border: 1px solid #d0d0d0;
      border-radius: 20px;
      font-size: 13px;
      margin-right: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      background: #fff;
    }
    .model-tag.selected {
      background: #555;
      color: #fff;
      border-color: #555;
    }
    .quick-action {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .quick-action a {
      flex: 1;
      min-width: 200px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="header">
    <h1>VideoPrompt AI</h1>
    <div class="nav">
      <a href="prompt-converter-home.html" class="active">转换</a>
      <a href="prompt-generator-create.html">生成</a>
      <a href="model-comparison-matrix.html">模型对比</a>
      <a href="template-library-browse.html">模板库</a>
      <a href="user-center-profile.html">我的</a>
    </div>
  </div>

  <div class="content">
    <!-- Hero 区域 -->
    <div class="hero">
      <h2>视频提示词，一键跨模型</h2>
      <p>粘贴提示词 → 选择目标模型 → 一键转换</p>
    </div>

    <!-- 功能切换标签 -->
    <div class="tab-switch">
      <a href="prompt-converter-home.html" class="active">提示词转换</a>
      <a href="prompt-generator-create.html">提示词生成</a>
    </div>

    <!-- 提示词输入区域 -->
    <div class="card">
      <div class="flex-between mb-12">
        <label style="font-size:14px; font-weight:600;">粘贴你的提示词</label>
        <span class="text-secondary">自动识别源模型</span>
      </div>
      <textarea class="input-field" rows="6" placeholder="在此粘贴你的视频提示词...&#10;&#10;例如：A golden retriever running on a beach at sunset, cinematic quality, slow motion, 4K resolution, warm color grading, tracking shot following the dog..."></textarea>

      <!-- 源模型识别结果 -->
      <div class="flex-between" style="padding:8px 12px; background:#fff; border:1px solid #d0d0d0; border-radius:6px; margin-bottom:16px;">
        <div class="flex gap-12" style="align-items:center;">
          <span class="text-secondary">源模型：</span>
          <span style="font-size:14px; font-weight:600; color:#4a90d9;">🟢 Runway Gen-4（自动识别）</span>
        </div>
        <select class="select-field" style="min-width:140px; padding:6px 8px; font-size:12px;">
          <option>手动选择...</option>
          <option selected>Runway Gen-4</option>
          <option>Kling AI</option>
          <option>Google Veo 3</option>
        </select>
      </div>

      <!-- 目标模型选择 -->
      <div class="mb-12">
        <label style="font-size:14px; font-weight:600; display:block; margin-bottom:8px;">选择目标模型</label>
        <div>
          <span class="model-tag">Runway Gen-4</span>
          <span class="model-tag selected">Kling AI</span>
          <span class="model-tag">Google Veo 3</span>
          <span class="model-tag" style="border-style:dashed; color:#888;">+ 更多模型（即将支持）</span>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="flex gap-16" style="align-items:center;">
        <a href="prompt-converter-result.html" class="btn-primary" style="flex:none;">🔄 一键转换</a>
        <span class="text-secondary">Free 用户今日剩余 8/10 次</span>
      </div>
    </div>

    <!-- 快捷入口 -->
    <div class="quick-action">
      <a href="template-library-browse.html">
        <div class="card" style="text-align:center;">
          <div style="font-size:24px; margin-bottom:4px;">📚</div>
          <div style="font-size:14px; font-weight:600;">浏览模板库</div>
          <div class="text-secondary">50+ 精选提示词模板</div>
        </div>
      </a>
      <a href="model-comparison-matrix.html">
        <div class="card" style="text-align:center;">
          <div style="font-size:24px; margin-bottom:4px;">📊</div>
          <div style="font-size:14px; font-weight:600;">模型对比</div>
          <div class="text-secondary">对比各模型参数和能力</div>
        </div>
      </a>
      <a href="prompt-generator-create.html">
        <div class="card" style="text-align:center;">
          <div style="font-size:24px; margin-bottom:4px;">✨</div>
          <div style="font-size:14px; font-weight:600;">AI 生成提示词</div>
          <div class="text-secondary">描述画面，AI 帮你写</div>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
