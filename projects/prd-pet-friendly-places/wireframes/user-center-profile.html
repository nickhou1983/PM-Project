<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 — 宠物友好场所</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; color: #333; }
.container { max-width: 375px; margin: 0 auto; min-height: 100vh; background: #fff; display: flex; flex-direction: column; }

.nav-back { padding: 8px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
.nav-back a { text-decoration: none; color: #666; font-size: 12px; }

/* 用户头部 */
.user-header { padding: 24px 16px; background: #fafafa; text-align: center; border-bottom: 1px solid #eee; }
.avatar { width: 64px; height: 64px; background: #e0e0e0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 10px; }
.username { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.user-stats { display: flex; justify-content: center; gap: 24px; margin-top: 12px; }
.stat-item { text-align: center; }
.stat-num { font-size: 18px; font-weight: 600; }
.stat-label { font-size: 11px; color: #999; margin-top: 2px; }

/* 宠物档案卡片 */
.pet-section { padding: 16px; }
.section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.section-title .add-btn { font-size: 12px; color: #666; cursor: pointer; padding: 4px 10px; border: 1px solid #ddd; border-radius: 14px; }

.pet-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #fafafa; border-radius: 10px; margin-bottom: 8px; }
.pet-avatar { width: 48px; height: 48px; background: #e8e8e8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.pet-info { flex: 1; }
.pet-name { font-size: 14px; font-weight: 500; }
.pet-detail { font-size: 12px; color: #999; margin-top: 2px; }
.pet-arrow { color: #ccc; font-size: 14px; }

/* 菜单列表 */
.menu-section { padding: 0 16px; }
.menu-group { margin-bottom: 16px; }
.menu-group-label { font-size: 12px; color: #999; margin-bottom: 6px; padding-left: 4px; }
.menu-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
.menu-item .menu-icon { width: 28px; font-size: 16px; }
.menu-item .menu-label { flex: 1; font-size: 14px; }
.menu-item .menu-badge { font-size: 11px; background: #f44336; color: #fff; border-radius: 8px; padding: 1px 6px; margin-right: 8px; }
.menu-item .menu-arrow { color: #ccc; font-size: 14px; }

/* 登录按钮（未登录状态） */
.login-prompt { padding: 24px 16px; text-align: center; }
.login-btn { width: 100%; height: 44px; background: #666; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin-bottom: 12px; }
.login-hint { font-size: 12px; color: #999; }

/* 底部 Tab */
.tab-bar { display: flex; background: #fff; border-top: 1px solid #eee; padding: 8px 0; margin-top: auto; }
.tab-item { flex: 1; text-align: center; padding: 6px 0; text-decoration: none; color: #999; }
.tab-item.active { color: #333; }
.tab-item .tab-icon { font-size: 20px; }
.tab-item .tab-label { font-size: 10px; margin-top: 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="nav-back">
    <a href="index.html">← 返回导航</a>
  </div>

  <!-- 用户头部 -->
  <div class="user-header">
    <div class="avatar">👤</div>
    <div class="username">柯基妈妈</div>
    <div class="user-stats">
      <div class="stat-item">
        <div class="stat-num">12</div>
        <div class="stat-label">收藏</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">5</div>
        <div class="stat-label">评价</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">3</div>
        <div class="stat-label">上报</div>
      </div>
    </div>
  </div>

  <!-- 宠物档案 -->
  <div class="pet-section">
    <div class="section-title">
      🐾 我的宠物
      <span class="add-btn">+ 添加</span>
    </div>
    <div class="pet-card">
      <div class="pet-avatar">🐕</div>
      <div class="pet-info">
        <div class="pet-name">奶茶</div>
        <div class="pet-detail">柯基 · 3岁 · 12kg</div>
      </div>
      <span class="pet-arrow">›</span>
    </div>
    <div class="pet-card">
      <div class="pet-avatar">🐈</div>
      <div class="pet-info">
        <div class="pet-name">小橘</div>
        <div class="pet-detail">橘猫 · 2岁 · 5kg</div>
      </div>
      <span class="pet-arrow">›</span>
    </div>
  </div>

  <!-- 功能菜单 -->
  <div class="menu-section">
    <div class="menu-group">
      <div class="menu-group-label">我的内容</div>
      <div class="menu-item">
        <span class="menu-icon">❤️</span>
        <span class="menu-label">我的收藏</span>
        <span class="menu-badge">12</span>
        <span class="menu-arrow">›</span>
      </div>
      <div class="menu-item">
        <span class="menu-icon">⭐</span>
        <span class="menu-label">我的评价</span>
        <span class="menu-arrow">›</span>
      </div>
      <div class="menu-item">
        <span class="menu-icon">📝</span>
        <span class="menu-label">我的上报</span>
        <span class="menu-badge">1 审核中</span>
        <span class="menu-arrow">›</span>
      </div>
    </div>

    <div class="menu-group">
      <div class="menu-group-label">设置</div>
      <div class="menu-item">
        <span class="menu-icon">🔔</span>
        <span class="menu-label">通知设置</span>
        <span class="menu-arrow">›</span>
      </div>
      <div class="menu-item">
        <span class="menu-icon">🔒</span>
        <span class="menu-label">账号与安全</span>
        <span class="menu-arrow">›</span>
      </div>
      <div class="menu-item">
        <span class="menu-icon">💬</span>
        <span class="menu-label">意见反馈</span>
        <span class="menu-arrow">›</span>
      </div>
      <div class="menu-item">
        <span class="menu-icon">ℹ️</span>
        <span class="menu-label">关于我们</span>
        <span class="menu-arrow">›</span>
      </div>
    </div>
  </div>

  <!-- 底部 Tab -->
  <div class="tab-bar">
    <a class="tab-item" href="place-discovery-map.html">
      <div class="tab-icon">🗺️</div>
      <div class="tab-label">发现</div>
    </a>
    <a class="tab-item" href="place-discovery-search.html">
      <div class="tab-icon">🔍</div>
      <div class="tab-label">搜索</div>
    </a>
    <a class="tab-item" href="user-contribution-submit.html">
      <div class="tab-icon">➕</div>
      <div class="tab-label">上报</div>
    </a>
    <a class="tab-item active" href="#">
      <div class="tab-icon">👤</div>
      <div class="tab-label">我的</div>
    </a>
  </div>
</div>
</body>
</html>
